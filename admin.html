<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — сообщения</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← на главную</a>
    <h1>Админ: сообщения</h1>
    <p class="note">Залогиньтесь через Google — только аккаунт <strong id="admin-email"></strong> может удалять.</p>

    <div class="status" id="status">Загрузка...</div>

    <div id="auth-box" hidden>
      <button class="btn" id="login">Войти через Google</button>
    </div>

    <div id="list"></div>

    <div id="news-admin" hidden>
      <h2 style="margin: 30px 0 12px;">Новости</h2>
      <div class="news-form">
        <input type="text" id="news-title" maxlength="200" placeholder="Заголовок">
        <textarea id="news-text" maxlength="5000" rows="4" placeholder="Текст новости"></textarea>
        <button class="btn" id="news-publish">Опубликовать</button>
      </div>
      <div id="news-admin-list" style="margin-top: 18px;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

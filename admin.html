<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — сообщения</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← на главную</a>
    <h1>Админ: сообщения</h1>
    <p class="note">Залогиньтесь через Google — только аккаунт <strong id="admin-email"></strong> может удалять.</p>

    <div class="status" id="status">Загрузка...</div>

    <div id="auth-box" hidden>
      <button class="btn" id="login">Войти через Google</button>
    </div>

    <div id="list"></div>

    <div id="news-admin" hidden>
      <h2 style="margin: 30px 0 12px;">Новости</h2>
      <div class="news-form">
        <div id="news-draft" class="news-draft" hidden></div>
        <div class="news-toolbar">
          <button type="button" class="tool" data-wrap="**" data-close="**">Жирный</button>
          <button type="button" class="tool" data-wrap="*" data-close="*">Курсив</button>
          <button type="button" class="tool" data-prefix="## ">Заголовок</button>
          <button type="button" class="tool" data-prefix="- ">Список</button>
          <button type="button" class="tool" data-link="1">Ссылка</button>
          <button type="button" class="tool" id="news-img-btn">Картинка</button>
          <input type="file" id="news-img" accept="image/*" hidden>
        </div>
        <input type="text" id="news-title" maxlength="200" placeholder="Заголовок">
        <textarea id="news-text" maxlength="5000" rows="4" placeholder="Текст новости — можно вставить картинку через Ctrl+V или перетащить файл"></textarea>
        <div class="news-cover-row">
          <button type="button" class="btn ghost" id="news-cover-btn">Обложка</button>
          <input type="file" id="news-cover" accept="image/*" hidden>
          <span class="cover-hint">Картинка-превью на карточке (необязательно)</span>
        </div>
        <div class="news-cover-box" id="news-cover-box" hidden>
          <img id="news-cover-img" alt="Обложка">
          <button type="button" class="btn small ghost" id="news-cover-remove">Убрать обложку</button>
        </div>
        <div class="news-actions">
          <button class="btn" id="news-publish">Опубликовать</button>
          <button class="btn ghost" id="news-edit-cancel" type="button" hidden>Отменить правку</button>
          <span class="news-status" id="news-status"></span>
        </div>
        <label class="news-preview-label" id="news-preview-label" hidden>Предпросмотр</label>
        <div class="news-preview" id="news-preview-box" hidden></div>
      </div>
      <div id="news-admin-list" style="margin-top: 18px;"></div>
    </div>

    <div id="fanfic-admin" hidden>
      <h2 style="margin: 30px 0 12px;">Фанфик</h2>
      <div class="news-form">
        <div class="news-toolbar">
          <button type="button" class="tool" data-wrap="**" data-close="**">Жирный</button>
          <button type="button" class="tool" data-wrap="*" data-close="*">Курсив</button>
          <button type="button" class="tool" data-prefix="## ">Заголовок</button>
          <button type="button" class="tool" data-prefix="- ">Список</button>
          <button type="button" class="tool" data-link="1">Ссылка</button>
          <button type="button" class="tool" id="fanfic-img-btn">Картинка</button>
          <input type="file" id="fanfic-img" accept="image/*" hidden>
        </div>
        <div class="fanfic-num-row">
          <input type="number" id="fanfic-num" min="1" step="1" value="1" placeholder="№">
          <input type="text" id="fanfic-title" maxlength="200" placeholder="Название главы">
        </div>
        <textarea id="fanfic-text" maxlength="50000" rows="10" placeholder="Текст главы — можно вставить картинку через Ctrl+V или перетащить файл"></textarea>
        <div class="news-actions">
          <button class="btn" id="fanfic-publish">Опубликовать</button>
          <button class="btn ghost" id="fanfic-cancel" type="button" hidden>Отменить правку</button>
          <span class="news-status" id="fanfic-status"></span>
        </div>
        <label class="news-preview-label" id="fanfic-preview-label" hidden>Предпросмотр</label>
        <div class="news-preview" id="fanfic-preview-box" hidden></div>
      </div>
      <div id="fanfic-admin-list" style="margin-top: 18px;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/live.js"></script>
</body>
</html>

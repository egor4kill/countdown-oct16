<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратный отсчёт — 16 октября 2026</title>
  <meta name="description" content="Точный обратный отсчёт до 16 октября 2026, 23:59:59">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b1020">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Обратный отсчёт — 16 октября 2026">
  <meta property="og:title" content="Обратный отсчёт — 16 октября 2026">
  <meta property="og:description" content="Точный обратный отсчёт до 16 октября 2026, 23:59:59">
  <meta property="og:url" content="https://egor4kill.github.io/countdown-oct16/">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:image" content="https://egor4kill.github.io/countdown-oct16/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Обратный отсчёт до 16 октября 2026">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab is-active" role="tab" data-tab="timer">Таймер</button>
    <button class="tab" role="tab" data-tab="news">Новости</button>
  </nav>

  <div class="tab-panel" id="tab-timer">
    <p class="subtitle">обратный отсчёт</p>
    <h1>До 16 октября <span>2026</span></h1>

    <div class="timer" role="timer" aria-live="polite">
      <div class="unit">
        <div class="value" id="days">00</div>
        <div class="label">дней</div>
      </div>
      <div class="unit">
        <div class="value" id="hours">00</div>
        <div class="label">часов</div>
      </div>
      <div class="unit">
        <div class="value" id="minutes">00</div>
        <div class="label">минут</div>
      </div>
      <div class="unit">
        <div class="value" id="seconds">00</div>
        <div class="ms" id="ms">.000</div>
        <div class="label">секунд</div>
      </div>
    </div>

    <div class="done">Время пришло — 16 октября 2026!</div>

    <div class="progress">
      <div class="progress-info">
        <span>16 сентября 2026</span>
        <span class="progress-percent" id="percent">100%</span>
        <span>16 октября 2026</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

    <p class="target" id="target"></p>

    <section class="poll" id="poll">
      <h2 class="poll-title" id="poll-question"></h2>
      <div class="poll-options" id="poll-options"></div>
      <p class="poll-hint" id="poll-hint"></p>
    </section>

    <form class="composer" id="composer">
      <input type="text" id="msg-input" maxlength="200" placeholder="Напишите что-нибудь..." autocomplete="off">
      <button type="submit" id="msg-send">Отправить</button>
    </form>

    <p class="admin-link"><a href="admin.html">admin</a></p>
  </div>

  <div class="tab-panel news-wrap" id="tab-news" hidden>
    <p class="subtitle">обратный отсчёт</p>
    <h1>Новости</h1>
    <div id="news-list">
      <div class="empty">Загрузка...</div>
    </div>
  </div>

  <div class="rain" id="rain"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/tabs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/poll.js"></script>
  <script src="js/news.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/live.js"></script>
</body>
</body>
</html>

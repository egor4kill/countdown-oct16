<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратный отсчёт — 16 октября 2026</title>
  <meta name="description" content="Точный обратный отсчёт до 16 октября 2026, 23:59:59">
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #8ea0c8;
      --accent: #4f8cff;
      --glow: rgba(79, 140, 255, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(11, 16, 32, 0.72), rgba(11, 16, 32, 0.72)),
        url("background.jpg") center / 100% 100% no-repeat fixed var(--bg);
      padding: 24px;
      text-align: center;
    }

    .subtitle {
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 700;
      margin-bottom: 48px;
      line-height: 1.2;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent), #a78bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .timer {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 32px);
      min-width: clamp(88px, 18vw, 170px);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .unit:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45), 0 0 30px var(--glow);
    }

    .value {
      font-size: clamp(48px, 11vw, 110px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 24px var(--glow);
    }

    .label {
      margin-top: 10px;
      font-size: clamp(11px, 1.6vw, 14px);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .ms {
      margin-top: 6px;
      font-size: clamp(18px, 3.5vw, 30px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-shadow: 0 0 16px var(--glow);
    }

    .separator {
      align-self: center;
      font-size: clamp(28px, 6vw, 52px);
      color: var(--muted);
      opacity: 0.6;
      display: none;
    }

    .target {
      margin-top: 44px;
      color: var(--muted);
      font-size: clamp(13px, 1.8vw, 16px);
    }

    .target strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .progress {
      margin-top: 36px;
      width: min(560px, 90vw);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: clamp(12px, 1.7vw, 15px);
      letter-spacing: 0.05em;
    }

    .progress-percent {
      color: var(--text);
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px var(--glow);
    }

    .progress-track {
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bff);
      border-radius: 999px;
      box-shadow: 0 0 24px var(--glow);
      transition: width 0.15s linear;
    }

    .done {
      display: none;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 700;
      background: linear-gradient(90deg, #5dff9b, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    body.finished .timer,
    body.finished .target,
    body.finished .progress { display: none; }
    body.finished .done { display: block; }

    .composer {
      margin-top: 36px;
      display: flex;
      gap: 10px;
      width: min(560px, 90vw);
      justify-content: center;
      flex-wrap: wrap;
    }

    .composer input {
      flex: 1 1 320px;
      padding: 14px 18px;
      font-size: clamp(14px, 2vw, 17px);
      font-family: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      backdrop-filter: blur(8px);
    }

    .composer input::placeholder { color: var(--muted); }

    .composer input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--glow);
    }

    .composer button {
      padding: 14px 26px;
      font-size: clamp(14px, 2vw, 17px);
      font-family: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, var(--accent), #a78bff);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 18px var(--glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .composer button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px var(--glow);
    }

    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .rain {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 20;
    }

    .rain-msg {
      position: absolute;
      top: -60px;
      white-space: nowrap;
      max-width: 70vw;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      color: #eef2ff;
      text-shadow: 0 0 12px rgba(79, 140, 255, 0.9), 0 2px 6px rgba(0, 0, 0, 0.7);
      opacity: 0;
      animation: rain-fall linear forwards;
      word-break: break-word;
    }

    @keyframes rain-fall {
      0%   { transform: translateY(0) rotate(-6deg); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(115vh) rotate(4deg); opacity: 0; }
    }

    .admin-link {
      margin-top: 14px;
      color: var(--muted);
      font-size: clamp(11px, 1.5vw, 13px);
      opacity: 0.7;
    }

    .admin-link a {
      color: inherit;
    }
  </style>
</head>
<body>
  <p class="subtitle">обратный отсчёт</p>
  <h1>До 16 октября <span>2026</span></h1>

  <div class="timer" role="timer" aria-live="polite">
    <div class="unit">
      <div class="value" id="days">00</div>
      <div class="label">дней</div>
    </div>
    <div class="unit">
      <div class="value" id="hours">00</div>
      <div class="label">часов</div>
    </div>
    <div class="unit">
      <div class="value" id="minutes">00</div>
      <div class="label">минут</div>
    </div>
    <div class="unit">
      <div class="value" id="seconds">00</div>
      <div class="ms" id="ms">.000</div>
      <div class="label">секунд</div>
    </div>
  </div>

  <div class="done">Время пришло — 16 октября 2026!</div>

  <div class="progress">
    <div class="progress-info">
      <span>16 сентября 2026</span>
      <span class="progress-percent" id="percent">100%</span>
      <span>16 октября 2026</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <p class="target" id="target"></p>

  <form class="composer" id="composer">
    <input type="text" id="msg-input" maxlength="200" placeholder="Напишите что-нибудь..." autocomplete="off">
    <button type="submit" id="msg-send">Отправить</button>
  </form>

  <p class="admin-link"><a href="admin.html">admin</a></p>

  <div class="rain" id="rain"></div>

  <script>
    (function () {
      var START = new Date(2026, 8, 16, 0, 0, 0, 0);
      var TARGET = new Date(2026, 9, 16, 23, 59, 59, 0);

      var els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
        ms: document.getElementById('ms'),
        target: document.getElementById('target'),
        percent: document.getElementById('percent'),
        fill: document.getElementById('fill')
      };

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function formatDate(d) {
        return d.toLocaleDateString('ru-RU', {
          day: 'numeric', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }

      function updateProgress() {
        var now = Date.now();
        var diff = TARGET.getTime() - now;
        var total = TARGET.getTime() - START.getTime();

        if (diff <= 0) {
          document.body.classList.add('finished');
          return;
        }

        var remaining = Math.max(0, Math.min(100, (diff / total) * 100));
        els.percent.textContent = remaining.toFixed(3) + '%';
        els.fill.style.width = remaining.toFixed(3) + '%';
      }

      function tick() {
        var diff = TARGET.getTime() - Date.now();

        if (diff <= 0) {
          document.body.classList.add('finished');
          return;
        }

        var ms = Math.floor(diff % 1000);
        els.ms.textContent = '.' + String(ms).padStart(3, '0');

        var seconds = Math.floor(diff / 1000);

        els.days.textContent = pad(Math.floor(seconds / 86400));
        els.hours.textContent = pad(Math.floor(seconds / 3600) % 24);
        els.minutes.textContent = pad(Math.floor(seconds / 60) % 60);
        els.seconds.textContent = pad(seconds % 60);
      }

      els.target.textContent = 'Целевая дата (по вашему местному времени): ' + formatDate(TARGET);

      tick();
      setInterval(tick, 40);

      updateProgress();
      setInterval(updateProgress, 100);
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    (function () {
      var firebaseConfig = {
        apiKey: "AIzaSyApLs9TpX6m1zuHgwouM8Ot0qgN2gD3v0A",
        authDomain: "sanya-1bd30.firebaseapp.com",
        projectId: "sanya-1bd30",
        storageBucket: "sanya-1bd30.firebasestorage.app",
        messagingSenderId: "437851305114",
        appId: "1:437851305114:web:110928e67e982c6b86db23",
        measurementId: "G-FVRRQTDD7K"
      };

      var app = firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore(app);

      var compos = document.getElementById('composer');
      var input = document.getElementById('msg-input');
      var send = document.getElementById('msg-send');
      var rain = document.getElementById('rain');
      var seen = {};
      var allMessages = [];

      function spawnMessage(text) {
        var el = document.createElement('div');
        el.className = 'rain-msg';
        el.textContent = text;

        var size = 16 + Math.floor(Math.random() * 18);
        var left = 2 + Math.random() * 88;
        var duration = 6 + Math.random() * 8;
        var delay = Math.random() * 3;

        el.style.left = left + 'vw';
        el.style.fontSize = size + 'px';
        el.style.animationDuration = duration + 's';
        el.style.animationDelay = delay + 's';

        rain.appendChild(el);
        setTimeout(function () { el.remove(); }, (duration + delay + 1) * 1000);
      }

      function addMessage(text) {
        return firebase.firestore().collection('messages').add({
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      compos.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;

        send.disabled = true;
        addMessage(text)
          .then(function () {
            input.value = '';
            send.disabled = false;
          })
          .catch(function (err) {
            console.error(err);
            alert('Не удалось отправить: ' + err.message);
            send.disabled = false;
          });
      });

      function spawnRandom() {
        if (!allMessages.length) return;
        var count = 1 + (Math.random() < 0.5 ? 1 : 0);
        for (var i = 0; i < count; i++) {
          var m = allMessages[Math.floor(Math.random() * allMessages.length)];
          if (m) spawnMessage(m);
        }
      }

      var firstSnapshot = true;

      db.collection('messages')
        .orderBy('createdAt', 'asc')
        .limitToLast(200)
        .onSnapshot(function (snap) {
          var isFirst = firstSnapshot;
          firstSnapshot = false;

          snap.docChanges().forEach(function (change) {
            if (change.type !== 'added') return;
            var id = change.doc.id;
            if (seen[id]) return;
            seen[id] = true;
            var data = change.doc.data();
            if (!data.text) return;
            allMessages.push(data.text);
            if (!isFirst) spawnMessage(data.text);
          });

          if (isFirst) {
            setTimeout(function () {
              for (var j = 0; j < 4; j++) spawnRandom();
            }, 300);
          }
        }, function (err) {
          console.error('listen error', err);
        });

      setInterval(spawnRandom, 1400);
    })();
  </script>
</body>
</html>

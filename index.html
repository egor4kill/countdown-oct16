<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратный отсчёт — 16 октября 2026</title>
  <meta name="description" content="Точный обратный отсчёт до 16 октября 2026, 23:59:59">
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #8ea0c8;
      --accent: #4f8cff;
      --glow: rgba(79, 140, 255, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(11, 16, 32, 0.72), rgba(11, 16, 32, 0.72)),
        url("background.jpg") center / 100% 100% no-repeat fixed var(--bg);
      padding: 24px;
      text-align: center;
    }

    .subtitle {
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 700;
      margin-bottom: 48px;
      line-height: 1.2;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent), #a78bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .timer {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(16px, 3vw, 32px) clamp(14px, 3vw, 28px);
      min-width: clamp(76px, 16vw, 150px);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .unit:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45), 0 0 30px var(--glow);
    }

    .value {
      font-size: clamp(34px, 8vw, 72px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 24px var(--glow);
    }

    .label {
      margin-top: 10px;
      font-size: clamp(11px, 1.6vw, 14px);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .separator {
      align-self: center;
      font-size: clamp(28px, 6vw, 52px);
      color: var(--muted);
      opacity: 0.6;
      display: none;
    }

    .target {
      margin-top: 44px;
      color: var(--muted);
      font-size: clamp(13px, 1.8vw, 16px);
    }

    .target strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .progress {
      margin-top: 36px;
      width: min(560px, 90vw);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: clamp(12px, 1.7vw, 15px);
      letter-spacing: 0.05em;
    }

    .progress-percent {
      color: var(--text);
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px var(--glow);
    }

    .progress-track {
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bff);
      border-radius: 999px;
      box-shadow: 0 0 24px var(--glow);
      transition: width 0.15s linear;
    }

    .done {
      display: none;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 700;
      background: linear-gradient(90deg, #5dff9b, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    body.finished .timer,
    body.finished .target,
    body.finished .progress { display: none; }
    body.finished .done { display: block; }
  </style>
</head>
<body>
  <p class="subtitle">обратный отсчёт</p>
  <h1>До 16 октября <span>2026</span></h1>

  <div class="timer" role="timer" aria-live="polite">
    <div class="unit">
      <div class="value" id="days">00</div>
      <div class="label">дней</div>
    </div>
    <div class="unit">
      <div class="value" id="hours">00</div>
      <div class="label">часов</div>
    </div>
    <div class="unit">
      <div class="value" id="minutes">00</div>
      <div class="label">минут</div>
    </div>
    <div class="unit">
      <div class="value" id="seconds">00</div>
      <div class="label">секунд</div>
    </div>
  </div>

  <div class="done">Время пришло — 16 октября 2026!</div>

  <div class="progress">
    <div class="progress-info">
      <span>16 сентября 2026</span>
      <span class="progress-percent" id="percent">100%</span>
      <span>16 октября 2026</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <p class="target" id="target"></p>

  <script>
    (function () {
      var START = new Date(2026, 8, 16, 0, 0, 0, 0);
      var TARGET = new Date(2026, 9, 16, 23, 59, 59, 0);

      var els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
        target: document.getElementById('target'),
        percent: document.getElementById('percent'),
        fill: document.getElementById('fill')
      };

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function formatDate(d) {
        return d.toLocaleDateString('ru-RU', {
          day: 'numeric', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }

      function updateProgress() {
        var now = Date.now();
        var diff = TARGET.getTime() - now;
        var total = TARGET.getTime() - START.getTime();

        if (diff <= 0) {
          document.body.classList.add('finished');
          return;
        }

        var remaining = Math.max(0, Math.min(100, (diff / total) * 100));
        els.percent.textContent = remaining.toFixed(1) + '%';
        els.fill.style.width = remaining.toFixed(3) + '%';
      }

      function tick() {
        var diff = TARGET.getTime() - Date.now();

        if (diff <= 0) {
          document.body.classList.add('finished');
          return;
        }

        var seconds = Math.floor(diff / 1000);

        els.days.textContent = pad(Math.floor(seconds / 86400));
        els.hours.textContent = pad(Math.floor(seconds / 3600) % 24);
        els.minutes.textContent = pad(Math.floor(seconds / 60) % 60);
        els.seconds.textContent = pad(seconds % 60);
      }

      els.target.textContent = 'Целевая дата (по вашему местному времени): ' + formatDate(TARGET);

      tick();
      setInterval(tick, 1000);

      updateProgress();
      setInterval(updateProgress, 100);
    })();
  </script>
</body>
</html>
